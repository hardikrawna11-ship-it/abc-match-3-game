<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>ABC Match 3</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:#f7f2df;
  color:#30452d;
  text-align:center;
}

header{
  padding:18px 10px 8px;
}

h1{
  margin:8px 0 4px;
  font-size:38px;
  color:#3d7138;
}

.subtitle{
  color:#777;
  font-size:18px;
}

.stats{
  display:flex;
  gap:10px;
  justify-content:center;
  padding:10px;
}

.stat{
  background:#fff9e8;
  border:2px solid #e5dbb8;
  border-radius:22px;
  padding:10px 18px;
  min-width:105px;
  box-shadow:0 3px 8px #00000012;
}

.stat b{
  display:block;
  font-size:25px;
  margin-top:5px;
}

.goal{
  max-width:680px;
  margin:10px auto 18px;
  padding:16px;
  background:#fff9e8;
  border:2px solid #e5dbb8;
  border-radius:22px;
  font-size:18px;
  font-weight:bold;
}

#board{
  width:min(94vw,620px);
  margin:auto;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:7px;
  padding:12px;
  background:#dce8ce;
  border:5px solid #c8d5b9;
  border-radius:28px;
}

.cell{
  aspect-ratio:1;
  border:0;
  border-radius:15px;
  font-size:clamp(25px,8vw,48px);
  font-weight:bold;
  color:white;
  text-shadow:0 2px 2px #0005;
  box-shadow:inset 0 -4px 0 #0002,0 2px 4px #0002;
  cursor:pointer;
  transition:.12s;
}

.cell:active{
  transform:scale(.92);
}

.selected{
  outline:5px solid #ffd84d;
  transform:scale(.94);
}

.c0{background:#e85d5d}
.c1{background:#e69b3a}
.c2{background:#62a85c}
.c3{background:#4f91d8}
.c4{background:#9a69c7}
.c5{background:#e06ca7}

button.new{
  margin:22px auto;
  padding:16px 28px;
  border:0;
  border-radius:18px;
  background:#3f7838;
  color:white;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

.message{
  min-height:28px;
  font-weight:bold;
  color:#3f7838;
}

@media(max-width:400px){
  .stats{gap:5px}
  .stat{min-width:90px;padding:8px}
  h1{font-size:32px}
}
</style>
</head>

<body>

<header>
  <div class="stats">
    <div class="stat">⭐ SCORE<b id="score">0</b></div>
    <div class="stat">LEVEL<b id="level">1</b></div>
    <div class="stat">❤️ LIVES<b id="lives">3</b></div>
  </div>

  <h1>ABC Match 3</h1>
  <div class="subtitle">Learn • Match • Grow</div>
</header>

<div class="goal">
  🎯 Goal: Match 3+
  <span id="progress">0 / 10</span>
</div>

<div id="board"></div>

<div class="message" id="message">
  Tap two adjacent letters to swap.
</div>

<button class="new" onclick="newGame()">🔄 New Game</button>

<script>
const ROWS=8;
const COLS=6;
const letters=["A","B","C","D","E","F"];

let board=[];
let score=0;
let level=1;
let lives=3;
let matches=0;
let selected=null;
let busy=false;

const boardEl=document.getElementById("board");

function randomLetter(){
  return letters[Math.floor(Math.random()*letters.length)];
}

function createBoard(){
  board=[];

  for(let r=0;r<ROWS;r++){
    board[r]=[];

    for(let c=0;c<COLS;c++){
      let letter;

      do{
        letter=randomLetter();
      }while(
        (c>=2 &&
         board[r][c-1]===letter &&
         board[r][c-2]===letter)
        ||
        (r>=2 &&
         board[r-1][c]===letter &&
         board[r-2][c]===letter)
      );

      board[r][c]=letter;
    }
  }

  render();
}

function render(){
  boardEl.innerHTML="";

  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const cell=document.createElement("button");

      cell.className=
        "cell c"+letters.indexOf(board[r][c]);

      cell.textContent=board[r][c];

      if(selected &&
         selected.r===r &&
         selected.c===c){
        cell.classList.add("selected");
      }

      cell.onclick=()=>tapCell(r,c);

      boardEl.appendChild(cell);
    }
  }

  document.getElementById("score").textContent=score;
  document.getElementById("level").textContent=level;
  document.getElementById("lives").textContent=lives;
  document.getElementById("progress").textContent=
    Math.min(matches,10)+" / 10";
}

function tapCell(r,c){
  if(busy || lives<=0) return;

  if(!selected){
    selected={r,c};
    render();
    return;
  }

  if(selected.r===r && selected.c===c){
    selected=null;
    render();
    return;
  }

  const adjacent=
    Math.abs(selected.r-r)+Math.abs(selected.c-c)===1;

  if(!adjacent){
    selected={r,c};
    render();
    return;
  }

  swap(selected.r,selected.c,r,c);
  selected=null;
  busy=true;

  const found=findMatches();

  if(found.size===0){
    setTimeout(()=>{
      swap(selectedUndoR,selectedUndoC,r,c);
      lives--;
      document.getElementById("message").textContent=
        "No match! Try another move.";
      busy=false;
      render();

      if(lives<=0) gameOver();
    },350);

    window.selectedUndoR=selectedUndoR;
    window.selectedUndoC=selectedUndoC;
  }else{
    clearMatches();
  }
}

let selectedUndoR=0;
let selectedUndoC=0;

function swap(r1,c1,r2,c2){
  selectedUndoR=r1;
  selectedUndoC=c1;

  const temp=board[r1][c1];
  board[r1][c1]=board[r2][c2];
  board[r2][c2]=temp;

  render();
}

function findMatches(){
  const found=new Set();

  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS-2;c++){
      if(
        board[r][c]===board[r][c+1] &&
        board[r][c]===board[r][c+2]
      ){
        found.add(r+","+c);
        found.add(r+","+(c+1));
        found.add(r+","+(c+2));
      }
    }
  }

  for(let c=0;c<COLS;c++){
    for(let r=0;r<ROWS-2;r++){
      if(
        board[r][c]===board[r+1][c] &&
        board[r][c]===board[r+2][c]
      ){
        found.add(r+","+c);
        found.add((r+1)+","+c);
        found.add((r+2)+","+c);
      }
    }
  }

  return found;
}

function clearMatches(){
  let found=findMatches();

  if(found.size===0){
    busy=false;
    render();
    return;
  }

  matches++;
  score+=found.size*10;

  if(matches>=10){
    level++;
    matches=0;
    lives=Math.min(3,lives+1);

    document.getElementById("message").textContent=
      "🎉 Level Up!";
  }else{
    document.getElementById("message").textContent=
      "✨ Great match!";
  }

  found.forEach(pos=>{
    const [r,c]=pos.split(",").map(Number);
    board[r][c]=null;
  });

  render();

  setTimeout(()=>{
    dropLetters();
  },300);
}

function dropLetters(){
  for(let c=0;c<COLS;c++){
    let values=[];

    for(let r=ROWS-1;r>=0;r--){
      if(board[r][c]!==null){
        values.push(board[r][c]);
      }
    }

    for(let r=ROWS-1,i=0;r>=0;r--,i++){
      board[r][c]=values[i] || randomLetter();
    }
  }

  render();

  setTimeout(()=>{
    if(findMatches().size>0){
      clearMatches();
    }else{
      busy=false;
    }
  },300);
}

function gameOver(){
  document.getElementById("message").textContent=
    "💔 Game Over! Press New Game.";
}

function newGame(){
  score=0;
  level=1;
  lives=3;
  matches=0;
  selected=null;
  busy=false;

  document.getElementById("message").textContent=
    "Tap two adjacent letters to swap.";

  createBoard();
}

newGame();
</script>

</body>
</html>
