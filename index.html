<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABC Match 3</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#182848,#4b6cb7);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
}

.game{
  width:100%;
  max-width:520px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.25);
  border-radius:25px;
  padding:18px;
  box-shadow:0 15px 40px rgba(0,0,0,.35);
  backdrop-filter:blur(10px);
}

h1{
  text-align:center;
  margin:5px 0 15px;
  font-size:32px;
}

.subtitle{
  text-align:center;
  opacity:.85;
  margin-bottom:15px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:15px;
}

.stat{
  background:rgba(0,0,0,.2);
  border-radius:14px;
  padding:10px 5px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:20px;
}

.stat span{
  font-size:12px;
  opacity:.8;
}

#board{
  width:100%;
  aspect-ratio:1/1;
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:5px;
  background:rgba(0,0,0,.2);
  padding:7px;
  border-radius:18px;
  touch-action:none;
}

.tile{
  border:0;
  border-radius:11px;
  font-size:clamp(20px,7vw,38px);
  font-weight:bold;
  color:white;
  cursor:pointer;
  box-shadow:
    inset 0 3px 5px rgba(255,255,255,.35),
    0 3px 5px rgba(0,0,0,.25);
  transition:transform .12s,opacity .12s;
  user-select:none;
}

.tile:active{
  transform:scale(.88);
}

.selected{
  outline:4px solid white;
  transform:scale(.88);
}

.pop{
  animation:pop .25s ease;
}

@keyframes pop{
  50%{transform:scale(1.25);opacity:.3}
}

.c1{background:#ff4757}
.c2{background:#2ed573}
.c3{background:#1e90ff}
.c4{background:#ffa502}
.c5{background:#a55eea}
.c6{background:#00cec9}

.buttons{
  display:flex;
  gap:10px;
  margin-top:15px;
}

button.control{
  flex:1;
  border:0;
  border-radius:14px;
  padding:13px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

#newGame{
  background:white;
  color:#182848;
}

#shuffle{
  background:#ffd32a;
  color:#222;
}

.message{
  text-align:center;
  min-height:25px;
  margin-top:12px;
  font-weight:bold;
}

.help{
  text-align:center;
  margin-top:12px;
  font-size:13px;
  opacity:.8;
}
</style>
</head>

<body>

<div class="game">

<h1>🎮 ABC Match 3</h1>

<div class="subtitle">
Match 3 or more same letters!
</div>

<div class="stats">
  <div class="stat">
    <b id="score">0</b>
    <span>SCORE</span>
  </div>

  <div class="stat">
    <b id="moves">30</b>
    <span>MOVES</span>
  </div>

  <div class="stat">
    <b id="level">1</b>
    <span>LEVEL</span>
  </div>
</div>

<div id="board"></div>

<div class="message" id="message">
  Swipe or tap two nearby tiles.
</div>

<div class="buttons">
  <button class="control" id="newGame">🔄 New Game</button>
  <button class="control" id="shuffle">🔀 Shuffle</button>
</div>

<div class="help">
  Match 3+ same letters horizontally or vertically.
</div>

</div>

<script>
const SIZE = 8;
const TYPES = 6;

const letters = ["A","B","C","D","E","F"];

let board = [];
let score = 0;
let moves = 30;
let level = 1;
let selected = null;
let busy = false;

const boardEl = document.getElementById("board");
const scoreEl = document.getElementById("score");
const movesEl = document.getElementById("moves");
const levelEl = document.getElementById("level");
const messageEl = document.getElementById("message");

function randomTile(){
  return Math.floor(Math.random() * TYPES);
}

function createBoard(){
  board = [];

  for(let r=0;r<SIZE;r++){
    board[r]=[];

    for(let c=0;c<SIZE;c++){
      let value;

      do{
        value=randomTile();
      }while(
        c>=2 &&
        board[r][c-1]===value &&
        board[r][c-2]===value
      );

      board[r][c]=value;
    }
  }
}

function drawBoard(){
  boardEl.innerHTML="";

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){

      const tile=document.createElement("button");

      tile.className="tile c"+(board[r][c]+1);
      tile.textContent=letters[board[r][c]];

      tile.dataset.row=r;
      tile.dataset.col=c;

      tile.addEventListener("click",()=>{
        selectTile(r,c);
      });

      boardEl.appendChild(tile);
    }
  }

  updateStats();
}

function updateStats(){
  scoreEl.textContent=score;
  movesEl.textContent=moves;
  levelEl.textContent=level;
}

function selectTile(r,c){

  if(busy || moves<=0) return;

  if(selected===null){
    selected={r,c};
    getTile(r,c).classList.add("selected");
    return;
  }

  const old=selected;
  getTile(old.r,old.c).classList.remove("selected");

  if(old.r===r && old.c===c){
    selected=null;
    return;
  }

  if(isAdjacent(old.r,old.c,r,c)){
    swapAndCheck(old.r,old.c,r,c);
  }else{
    selected={r,c};
    getTile(r,c).classList.add("selected");
  }
}

function getTile(r,c){
  return boardEl.children[r*SIZE+c];
}

function isAdjacent(r1,c1,r2,c2){
  return Math.abs(r1-r2)+Math.abs(c1-c2)===1;
}

async function swapAndCheck(r1,c1,r2,c2){

  busy=true;
  selected=null;

  swap(r1,c1,r2,c2);
  drawBoard();

  let matches=findMatches();

  if(matches.length===0){

    await wait(180);

    swap(r1,c1,r2,c2);
    drawBoard();

    messageEl.textContent="❌ No match!";
    busy=false;
    return;
  }

  moves--;

  await clearMatchesLoop();

  if(moves<=0){
    messageEl.textContent="🎉 Game Over! Press New Game.";
  }else{
    messageEl.textContent="🔥 Great match!";
  }

  busy=false;
}

function swap(r1,c1,r2,c2){
  const temp=board[r1][c1];
  board[r1][c1]=board[r2][c2];
  board[r2][c2]=temp;
}

function findMatches(){

  const found=new Set();

  // Horizontal
  for(let r=0;r<SIZE;r++){

    let start=0;

    for(let c=1;c<=SIZE;c++){

      if(
        c<SIZE &&
        board[r][c]===board[r][start]
      ){
        continue;
      }

      const length=c-start;

      if(length>=3){
        for(let x=start;x<c;x++){
          found.add(r+","+x);
        }
      }

      start=c;
    }
  }

  // Vertical
  for(let c=0;c<SIZE;c++){

    let start=0;

    for(let r=1;r<=SIZE;r++){

      if(
        r<SIZE &&
        board[r][c]===board[start][c]
      ){
        continue;
      }

      const length=r-start;

      if(length>=3){
        for(let x=start;x<r;x++){
          found.add(x+","+c);
        }
      }

      start=r;
    }
  }

  return [...found].map(x=>{
    const [r,c]=x.split(",").map(Number);
    return {r,c};
  });
}

async function clearMatchesLoop(){

  while(true){

    const matches=findMatches();

    if(matches.length===0) break;

    score += matches.length * 10;

    if(score >= level*500){
      level++;
      messageEl.textContent="⭐ Level Up!";
    }

    matches.forEach(({r,c})=>{
      const tile=getTile(r,c);
      if(tile) tile.classList.add("pop");
    });

    await wait(220);

    matches.forEach(({r,c})=>{
      board[r][c]=null;
    });

    dropTiles();
    fillEmpty();

    drawBoard();

    await wait(120);
  }
}

function dropTiles(){

  for(let c=0;c<SIZE;c++){

    let write=SIZE-1;

    for(let r=SIZE-1;r>=0;r--){

      if(board[r][c]!==null){
        board[write][c]=board[r][c];

        if(write!==r){
          board[r][c]=null;
        }

        write--;
      }
    }

    while(write>=0){
      board[write][c]=null;
      write--;
    }
  }
}

function fillEmpty(){

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){

      if(board[r][c]===null){
        board[r][c]=randomTile();
      }
    }
  }

  // Make sure the new board does not start with matches.
  let safety=0;

  while(findMatches().length>0 && safety<100){

    const matches=findMatches();

    matches.forEach(({r,c})=>{
      board[r][c]=randomTile();
    });

    safety++;
  }
}

function shuffleBoard(){

  if(busy || moves<=0) return;

  let values=board.flat();

  for(let i=values.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [values[i],values[j]]=[values[j],values[i]];
  }

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      board[r][c]=values[r*SIZE+c];
    }
  }

  if(findMatches().length>0){
    createBoard();
  }

  drawBoard();

  messageEl.textContent="🔀 Board shuffled!";
}

function newGame(){

  score=0;
  moves=30;
  level=1;
  selected=null;
  busy=false;

  createBoard();
  drawBoard();

  messageEl.textContent="🎮 Game started!";
}

function wait(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

document.getElementById("newGame").addEventListener("click",newGame);
document.getElementById("shuffle").addEventListener("click",shuffleBoard);


// Swipe support for mobile
let touchStart=null;

boardEl.addEventListener("touchstart",(e)=>{

  if(e.touches.length!==1) return;

  const t=e.touches[0];

  touchStart={
    x:t.clientX,
    y:t.clientY
  };

},{passive:true});

boardEl.addEventListener("touchend",(e)=>{

  if(!touchStart || busy || moves<=0) return;

  const t=e.changedTouches[0];

  const dx=t.clientX-touchStart.x;
  const dy=t.clientY-touchStart.y;

  touchStart=null;

  if(Math.max(Math.abs(dx),Math.abs(dy))<25) return;

  const element=document.elementFromPoint(t.clientX,t.clientY);

  if(!element || !element.classList.contains("tile")) return;

  const r=parseInt(element.dataset.row);
  const c=parseInt(element.dataset.col);

  if(selected===null) return;

  let r2=r;
  let c2=c;

  if(Math.abs(dx)>Math.abs(dy)){
    c2 += dx>0 ? -1 : 1;
  }else{
    r2 += dy>0 ? -1 : 1;
  }

  if(
    r2>=0 && r2<SIZE &&
    c2>=0 && c2<SIZE &&
    isAdjacent(r,c,r2,c2)
  ){
    getTile(selected.r,selected.c).classList.remove("selected");
    swapAndCheck(selected.r,selected.c,r2,c2);
  }

});

newGame();
</script>

</body>
</html>
